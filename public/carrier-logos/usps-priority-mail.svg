<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <defs>
    <linearGradient id="uspsBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3"/>
      <stop offset="100%" style="stop-color:#004B87"/>
    </linearGradient>
    <linearGradient id="priorityRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DA291C"/>
      <stop offset="100%" style="stop-color:#E8382D"/>
    </linearGradient>
  </defs>
  <rect width="280" height="80" fill="#FFFFFF" rx="4"/>
  <!-- USPS Eagle Symbol -->
  <g transform="translate(12, 16) scale(0.85)">
    <path d="M0 28 Q8 10 28 16 L40 8 L32 20 L44 14 Q52 24 48 38 L28 46 L36 34 L20 40 Q6 38 0 28 Z" fill="url(#uspsBlue)"/>
  </g>
  <!-- Priority Mail branding -->
