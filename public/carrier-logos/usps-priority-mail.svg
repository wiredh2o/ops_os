  <text x="65" y="54" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#DA291C">Priority Mail</text>
  <rect x="65" y="60" width="130" height="4" fill="url(#priorityRed)" rx="2"/>
  <text x="65" y="75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#666666">1-3 Day Delivery</text>
</svg>