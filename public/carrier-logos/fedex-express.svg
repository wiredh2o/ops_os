<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60">
  <rect width="160" height="60" fill="#FFFFFF" rx="4"/>
  <!-- FedEx logo -->
  <text x="80" y="32" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="-1">
    <tspan fill="#4D148C">Fed</tspan><tspan fill="#FF6600">Ex</tspan>
  </text>
  <!-- Express text -->
  <text x="80" y="50" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FF6600" letter-spacing="0.5">Express</text>
</svg>